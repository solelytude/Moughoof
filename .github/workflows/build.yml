name: Build Moughoof

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build
        run: msbuild Moughoof.csproj /p:Configuration=Release

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Moughoof-win-x64
          path: bin/Release/
